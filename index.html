<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ANDON Estampado</title>
<style>
:root{--bg:#f0f2f6;--tx:#212529;--mut:#6c757d;--C:#dc3545;--A:#fd7e14;--X:#0d6efd;--K:#28a745;--b:#0d6efd;--dk:#212529}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
.tt{flex:1;min-width:0}h1{margin:0;font-size:clamp(1.1rem,3.2vh,1.9rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{color:var(--mut);font-weight:700;font-size:clamp(.7rem,1.8vh,.95rem)}
.btns{display:flex;gap:6px;flex:none}
.btn{border:0;border-radius:30px;background:var(--dk);color:#fff;font-weight:800;font-size:clamp(.7rem,1.8vh,.9rem);padding:9px 14px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.18);white-space:nowrap}
.btn.blue{background:var(--b)}input[type=file]{display:none}
@media(max-width:560px){.btn span{display:none}.btn{padding:9px 11px}}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 28px rgba(33,37,41,.12);margin:0 12px;padding:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.hid{display:none!important}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:1fr;gap:10px}
.press{border:0;border-bottom:6px solid;border-radius:18px;background:#f8f9fb;cursor:pointer;font-family:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.press b{font-size:clamp(1rem,3vh,1.5rem)}.press small{color:var(--mut);font-weight:700}.press em{font-style:normal;font-size:clamp(1.4rem,5vh,2.6rem)}.press strong{font-size:clamp(.7rem,1.8vh,.95rem)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;flex:none}
.sum div{text-align:center;border-radius:14px;padding:5px 2px;background:#f8f9fb;font-weight:800}.sum span{display:block;font-size:clamp(1.2rem,4vh,2rem);line-height:1.1}.sum small{font-size:clamp(.55rem,1.5vh,.8rem);letter-spacing:.3px}
.hd{display:grid;grid-template-columns:1fr 1fr 1fr;color:var(--mut);font-weight:800;font-size:.7rem;text-transform:uppercase;padding:0 14px 4px;flex:none}.hd :last-child{text-align:right}.hd :nth-child(2){text-align:center}
#list{flex:1;min-height:0;display:grid;grid-auto-flow:column;gap:6px;overflow:auto}
.row{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;background:#f8f9fb;border-radius:calc(var(--rh)*.25);border-left:calc(var(--rh)*.1) solid;padding:0 calc(var(--rh)*.2) calc(var(--rh)*.1);overflow:hidden;min-width:0}
.s{font-size:max(15px,calc(var(--rh)*.36));font-weight:800}.p{font-size:max(11px,calc(var(--rh)*.2));color:var(--mut);font-weight:700;text-align:center}
.h{text-align:right;font-size:max(17px,calc(var(--rh)*.42));font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h small{display:block;font-size:max(9px,calc(var(--rh)*.15));letter-spacing:.5px;margin-top:2px}
.bar{position:absolute;left:calc(var(--rh)*.2);right:calc(var(--rh)*.2);bottom:calc(var(--rh)*.08);height:max(4px,calc(var(--rh)*.07));background:#e5e5e5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.C{border-color:var(--C);color:var(--C)}.A{border-color:var(--A);color:var(--A)}.X{border-color:var(--X);color:var(--X)}.K{border-color:var(--K);color:var(--K)}
.bgC{background:var(--C)}.bgA{background:var(--A)}.bgX{background:var(--X)}.bgK{background:var(--K)}
.row .s{color:var(--tx)}.row.C{background:#fdecee;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.55}}
.foot{flex:none;text-align:center;color:var(--mut);font-style:italic;font-size:clamp(.6rem,1.5vh,.8rem);padding:5px}
</style></head><body>
<header><div class="tt"><h1 id="ttl"></h1><div class="clk" id="clk"></div></div>
<div class="btns"><button class="btn blue hid" id="back" onclick="home()">⬅️ <span>PRENSAS</span></button><button class="btn" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⏱️ <span>PANTALLA COMPLETA</span></button><label class="btn">📂 <span>CARGAR CSV</span><input type="file" accept=".csv" id="f"></label></div></header>
<div id="home" class="card"><div class="grid" id="grid"></div></div>
<div id="det" class="card hid"><div class="sum" id="sum"></div><div class="hd"><span>Sebango</span><span>Process name</span><span>Horas de alcance</span></div><div id="list"></div></div>
<div class="foot" id="foot"></div>
<script>
let DATA=[],src="INVENTARIO_GENERAL.csv",sel=null,upd=new Date();
const CSV_URL="INVENTARIO_GENERAL.csv",REFRESH_MS=60000;
const PR=["LPS150","TD200","TR1600 - TR1","TR800 - TR2","TR1600 - TR3","TR800 - TR4","PG300 - PG1","PG200 - PG2","PG300 - PG3","PG200 - PG4"];
/* Umbrales (h): ajustar aquí */ const T={C:2,A:8,X:24};
const $=id=>document.getElementById(id),ORD=["C","A","X","K"];
const cl=h=>h<T.C?"C":h<T.A?"A":h<T.X?"X":"K";
const LB={C:"CRÍTICO",A:"ATENCIÓN",X:"ACCIÓN",K:"CALMA"},EM={C:"🚨",A:"⚠️",X:"⚙️",K:"✅"};
const PTS=[[0,5],[4.1,44],[12.6,70],[48.6,90],[120,100]];
function pct(h){for(let i=1;i<PTS.length;i++){if(h<=PTS[i][0]){const[a,b]=[PTS[i-1],PTS[i]];return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0])}}return 100}
function home(){sel=null;render()}
function render(){
 $("home").classList.toggle("hid",!!sel);$("det").classList.toggle("hid",!sel);$("back").classList.toggle("hid",!sel);
 $("ttl").textContent=sel?"🏭 "+sel:"🚨 Andon de Estampado – Selecciona prensa";
 if(!sel){$("grid").innerHTML=PR.map(p=>{const r=DATA.filter(x=>x[1]===p),m=r.length?Math.min(...r.map(x=>x[2])):999,c=cl(m),n=r.filter(x=>cl(x[2])==="C").length;
  return `<button class="press ${c}" onclick="sel='${p}';render()"><b>${p}</b><small>${r.length} sebangos</small><em>${EM[c]}</em><strong>${n?n+" CRÍTICO"+(n>1?"S":""):LB[c]}</strong></button>`}).join("")}
 else{const r=DATA.filter(x=>x[1]===sel).sort((a,b)=>a[2]-b[2]),k={C:0,A:0,X:0,K:0};r.forEach(x=>k[cl(x[2])]++);
  $("sum").innerHTML=ORD.map(c=>`<div class="${c}"><span>${k[c]}</span><small>${EM[c]} ${LB[c]}</small></div>`).join("");
  $("list").innerHTML=r.map(x=>{const c=cl(x[2]);return `<div class="row ${c}"><span class="s">${x[0]}</span><span class="p">${x[1]}</span><span class="h">${x[2].toFixed(1)}h<small>${EM[c]} ${LB[c]}</small></span><div class="bar"><i class="bg${c}" style="width:${pct(x[2])}%"></i></div></div>`}).join("")||"<p>Sin sebangos</p>";fit()}
 $("foot").textContent="Última carga de archivo: "+upd.toLocaleString("es-MX")+" · "+src}
function fit(){const L=$("list"),n=L.children.length;if(!n||!sel)return;const W=L.clientWidth,H=L.clientHeight,g=6,maxC=Math.max(1,Math.floor(W/300));
 let c=1;for(;c<maxC;c++){const r=Math.ceil(n/c);if((H-g*(r-1))/r>=60)break}
 const r=Math.ceil(n/c);let rh=(H-g*(r-1))/r;rh=Math.min(Math.max(rh,44),96);
 L.style.setProperty("--rh",rh+"px");L.style.gridTemplateRows=`repeat(${r},${rh}px)`;L.style.gridAutoColumns="minmax(0,1fr)"}
addEventListener("resize",fit);document.addEventListener("fullscreenchange",()=>setTimeout(fit,150));
const tick=()=>$("clk").textContent=new Date().toLocaleString("es-MX");setInterval(tick,1000);tick();setInterval(render,30000);
function parse(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!="\r")c+=ch}r.push(c);R.push(r);return R}
function toData(buf){
 const rows=parse(new TextDecoder("latin1").decode(buf));const hi=rows.findIndex(r=>r.some(v=>v.trim().toUpperCase()==="SEBANGO"));if(hi<0)throw 0;
 const H=rows[hi].map(v=>v.trim().toUpperCase()),iS=H.indexOf("SEBANGO"),iP=H.indexOf("PROCESS NAME"),iH=H.indexOf("SCOPE HOURS");
 const d=rows.slice(hi+1).filter(r=>r[iS]&&r[iS].trim()&&r[iP]&&r[iP].trim()).map(r=>[r[iS].trim(),r[iP].trim(),parseFloat((r[iH]||"0").replace(/,/g,""))||0]);
 if(!d.length)throw 0;return d}
async function loadRemote(){try{const r=await fetch(CSV_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
 DATA=toData(await r.arrayBuffer());const lm=r.headers.get("Last-Modified");upd=lm?new Date(lm):new Date();src=CSV_URL;render()}
 catch(e){if(!DATA.length)$("foot").textContent="⚠️ No se pudo cargar "+CSV_URL+" (¿se abrió como archivo local? Usa CARGAR CSV o publica en GitHub Pages)"}}
$("f").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{DATA=toData(await fl.arrayBuffer());src=fl.name;upd=new Date();render()}
 catch(x){alert("No se pudo leer el CSV (columnas esperadas: SEBANGO, Process Name, SCOPE HOURS).")}};
loadRemote();setInterval(loadRemote,REFRESH_MS);
render();
</script></body></html>
