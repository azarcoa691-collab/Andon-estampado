<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ANDON Estampado</title>
<style>
:root{--bg:#f0f2f6;--tx:#212529;--mut:#6c757d;--C:#dc3545;--A:#fd7e14;--X:#0d6efd;--K:#28a745;--dk:#212529;--cols:38px 1fr 1.5fr 1fr auto}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}.tt{flex:1;min-width:0}
h1{margin:0;font-size:clamp(1rem,3vh,1.8rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{color:var(--mut);font-weight:700;font-size:clamp(.65rem,1.7vh,.9rem)}
.btns{display:flex;gap:6px;flex:none}
.btn{border:0;border-radius:30px;background:var(--dk);color:#fff;font-weight:800;font-size:clamp(.7rem,1.7vh,.88rem);padding:9px 13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.18);white-space:nowrap}
.btn.blue{background:#0d6efd}.btn.red{background:var(--C)}.btn.on{background:var(--K)}input[type=file]{display:none}
@media(max-width:700px){.btn span{display:none}.btn{padding:9px 11px}}
.hid{display:none!important}
#alert{flex:none;margin:0 12px 8px;background:var(--C);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;animation:bl 1s infinite;font-size:clamp(.75rem,2vh,1rem)}
#qalert{flex:none;margin:0 12px 8px;background:#6f42c1;color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:clamp(.75rem,2vh,1rem)}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 28px rgba(33,37,41,.12);margin:0 12px;padding:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:1fr;gap:10px}
.press{border:0;border-bottom:6px solid;border-radius:18px;background:#f8f9fb;cursor:pointer;font-family:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.press b{font-size:clamp(1rem,3vh,1.5rem)}.press small{color:var(--mut);font-weight:700}.press em{font-style:normal;font-size:clamp(1.4rem,5vh,2.6rem)}.press strong{font-size:clamp(.7rem,1.8vh,.95rem)}
.press.blink{animation:bl .8s infinite;box-shadow:0 0 0 5px var(--C)}
.sum{display:grid;grid-template-columns:1.6fr repeat(4,1fr) 1.3fr;gap:8px;margin-bottom:8px;flex:none}
.sum div{text-align:center;border-radius:14px;padding:5px 2px;background:#f8f9fb;font-weight:800}.sum span{display:block;font-size:clamp(1.2rem,4vh,2rem);line-height:1.1}.sum small{font-size:clamp(.55rem,1.5vh,.8rem);display:block}.sum .pat{background:#212529;color:#fff}.sum .pat span{font-size:clamp(1.3rem,4.6vh,2.3rem)}
#man{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eef4ff;border-radius:14px;padding:5px 10px;margin-bottom:8px;font-size:clamp(.7rem,1.7vh,.9rem);font-weight:700;flex:none}
#man select{padding:5px 8px;border-radius:10px;border:1px solid #ced4da;font:inherit;max-width:42vw}
.hd{display:grid;grid-template-columns:var(--cols);gap:6px;color:var(--mut);font-weight:800;font-size:.68rem;text-transform:uppercase;padding:0 14px 4px;flex:none}.hd :nth-child(4){text-align:right}
#list{flex:1;min-height:0;display:grid;grid-auto-flow:column;gap:6px;overflow:auto}
.row{position:relative;display:grid;grid-template-columns:var(--cols);gap:6px;align-items:center;background:#f8f9fb;border-radius:calc(var(--rh)*.25);border-left:calc(var(--rh)*.1) solid;padding:0 calc(var(--rh)*.15) calc(var(--rh)*.1) calc(var(--rh)*.15);overflow:hidden;min-width:0}
.n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#212529;color:#fff;font-weight:900;font-size:15px}.n.man{background:#0d6efd}.n.run{background:var(--K)}
.s{font-size:max(17px,calc(var(--rh)*.44));font-weight:800;color:var(--tx)}
.pt{font-size:max(11px,calc(var(--rh)*.21));font-weight:800;color:#495057;line-height:1.15}.pt.run{color:var(--K)}.pt small{display:block;font-weight:700;font-size:.8em;color:var(--mut)}.pt small.bad{color:var(--C)}
.h{text-align:right;font-size:max(19px,calc(var(--rh)*.48));font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h small{display:block;font-size:max(10px,calc(var(--rh)*.16));margin-top:2px}
.ac{display:flex;gap:4px}.ib{border:0;border-radius:50%;width:calc(var(--rh)*.55);height:calc(var(--rh)*.55);min-width:30px;min-height:30px;font-size:max(13px,calc(var(--rh)*.25));cursor:pointer;color:#fff}
.ib.go{background:var(--K)}.ib.ok{background:#0d6efd}.ib.no{background:var(--C)}
.bar{position:absolute;left:calc(var(--rh)*.2);right:calc(var(--rh)*.2);bottom:calc(var(--rh)*.08);height:max(4px,calc(var(--rh)*.07));background:#e5e5e5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.C{border-color:var(--C);color:var(--C)}.A{border-color:var(--A);color:var(--A)}.X{border-color:var(--X);color:var(--X)}.K{border-color:var(--K);color:var(--K)}
.bgC{background:var(--C)}.bgA{background:var(--A)}.bgX{background:var(--X)}.bgK{background:var(--K)}
.row.C{background:#fdecee}.row.C:not(.isrun){animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.55}}
.row.isrun{background:#eaf7ee}
body.alarm::after{content:"";position:fixed;inset:0;border:10px solid var(--C);pointer-events:none;animation:bl .6s infinite;z-index:50}
#abt{overflow:auto}table{width:100%;border-collapse:collapse;font-size:clamp(.75rem,1.9vh,1rem)}th{text-align:left;color:var(--mut);font-size:.72rem;text-transform:uppercase;padding:6px;position:sticky;top:0;background:#fff}td{padding:8px 6px;border-top:1px solid #e5e7eb}
.tag{border-radius:20px;padding:3px 9px;color:#fff;font-weight:800;font-size:.75rem;white-space:nowrap}.mini{border:0;border-radius:20px;padding:5px 10px;background:var(--K);color:#fff;font-weight:800;cursor:pointer}
.foot{flex:none;text-align:center;color:var(--mut);font-style:italic;font-size:clamp(.6rem,1.5vh,.78rem);padding:5px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#212529;color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;z-index:60;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}#toast a{color:#7dd3fc}
dialog{border:0;border-radius:22px;padding:20px;width:min(420px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}dialog label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;padding:10px;border:1px solid #ced4da;border-radius:10px;font:inherit;font-size:1rem}
.dbt{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
@media(max-width:560px){:root{--cols:38px 1fr 1.3fr 1fr auto}.sum{grid-template-columns:repeat(4,1fr)}.sum .w{grid-column:span 2}}

<header><div class="tt"><h1 id="ttl"></h1><div class="clk" id="clk"></div></div>
<div class="btns"><button class="btn" id="snd" onclick="toggleSnd()">🔇 <span>SONIDO</span></button><button class="btn" id="abtn" onclick="V='abt';render()">❌ <span>ABORTADOS</span> <b id="abn"></b></button><button class="btn blue hid" id="back" onclick="home()">⬅️ <span>PRENSAS</span></button><button class="btn" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⏱️ <span>PANTALLA COMPLETA</span></button><label class="btn">📂 <span>CARGAR INVENTARIO</span><input type="file" accept=".csv,.xlsx,.xls" id="f"></label></div></header>

/* Cola de corrida: 0 en prensa · 1 crítico · 2 no verde que se agota antes de su patrón · 3 patrón en curso · 4 VERDE que no alcanza a su patrón (se inserta tras el patrón en curso, sin desplazarlo) · 5 resto por orden de patrón */

function listFor(p,now){const it=S.rows.filter(x=>x[1]===p).map(x=>info(x,now));
 it.sort((a,b)=>rank(a)-rank(b)||(rank(a)<5?a.h-b.h:0)||(a.nr?a.nr.idx:999)-(b.nr?b.nr.idx:999)||a.h-b.h);
 const q=it.filter(i=>!i.run),o=OVR[p]||[],fx=[0,1].map(k=>q.find(i=>i.x[0]===o[k])||null);if(fx[1]===fx[0])fx[1]=null; /* posiciones 1 y 2 manuales */
