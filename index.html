<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andon Estampado - KTMEX</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #c00; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: bold; text-transform: uppercase; font-size: 0.9em; }
        .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .status-syncing { background-color: #ffc107; }
        .status-ok { background-color: #28a745; }
        .badge { padding: 5px 10px; border-radius: 12px; font-weight: bold; font-size: 0.85em; }
        .bg-danger { background-color: #dc3545; color: white; }
        .bg-success { background-color: #28a745; color: white; }
        .bg-warning { background-color: #ffc107; color: black; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Andon - Tablero de Estampado</h1>
        <div id="sync-status">
            <span class="status-indicator status-syncing" id="indicator"></span>
            <span id="sync-text">Conectando a Firebase...</span>
        </div>
    </div>

    <div class="card">
        <h2>Inventario Actual (Sincronizado con PC)</h2>
        <table>
            <thead>
                <tr>
                    <th>Número de Parte (SEBANGO)</th>
                    <th>Máquina</th>
                    <th>Alcance (Scope)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabla-inventario">
                <tr><td colspan="4">Esperando datos de Producción...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Patrón de Turno Actual</h2>
        <p><strong>Fecha: </strong><span id="fecha-hoy"></span></p>
        <p><strong>Patrón Programado: </strong><span id="patron-hoy"></span></p>
    </div>
</div>

<!-- Usamos type="module" para poder importar Firebase -->
<script type="module">
    // 1. IMPORTAR FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 2. CREDENCIALES (Las mismas de tu app de PC)
    const firebaseConfig = {
        apiKey: "AIzaSyCAQLyNPSiyjKKPz3vyHr1rdVa0dBz7dq4",
        authDomain: "logistica-ktmex.firebaseapp.com",
        projectId: "logistica-ktmex",
        storageBucket: "logistica-ktmex.firebasestorage.app",
        messagingSenderId: "166597623735",
        appId: "1:166597623735:web:2da1c2d554cf4d6181b232"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 3. ESCUCHAR CAMBIOS EN TIEMPO REAL
    const tbody = document.getElementById('tabla-inventario');
    const indicator = document.getElementById('indicator');
    const syncText = document.getElementById('sync-text');

    // onSnapshot mantiene una conexión viva. Si PC sube un CSV, la tabla se actualiza sola al segundo.
    onSnapshot(collection(db, "conveyors"), (snapshot) => {
        tbody.innerHTML = ''; // Limpiar tabla
        
        if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="4">No hay datos de inventario registrados por PC.</td></tr>';
            indicator.className = 'status-indicator status-ok';
            syncText.textContent = 'Sin datos';
            return;
        }

        // Convertir snapshot a un array para poder ordenarlo (ej. por criticidad o scope)
        let inventario = [];
        snapshot.forEach((doc) => {
            inventario.push({ id: doc.id, ...doc.data() });
        });

        // Ordenar de menor scope (más crítico) a mayor scope
        inventario.sort((a, b) => a.scope - b.scope);

        inventario.forEach(item => {
            const tr = document.createElement('tr');
            
            // Asignar colores según el scope (igual que en tu lógica de PC: < 9h es crítico)
            let statusBadge = '';
            if (item.scope < 4) {
                statusBadge = '<span class="badge bg-danger">URGENTE</span>';
            } else if (item.scope < 9) {
                statusBadge = '<span class="badge bg-warning">CRÍTICO</span>';
            } else {
                statusBadge = '<span class="badge bg-success">NORMAL</span>';
            }

            tr.innerHTML = `
                <td><strong>${item.id}</strong></td>
                <td>${item.maquina || 'N/A'}</td>
                <td>${item.scope} h</td>
                <td>${statusBadge}</td>
            `;
            tbody.appendChild(tr);
        });

        // Actualizar indicador visual
        indicator.className = 'status-indicator status-ok';
        syncText.textContent = 'En vivo';
    }, (error) => {
        console.error('Error al conectar con Firebase:', error);
        indicator.className = 'status-indicator status-syncing';
        indicator.style.backgroundColor = '#dc3545'; // Rojo de error
        syncText.textContent = 'Error de red';
    });

    // 4. LÓGICA DEL CALENDARIO DE PATRONES
    function obtenerPatronDeHoy() {
        const hoy = new Date();
        const fechaFormat = hoy.toISOString().split('T')[0];
        document.getElementById('fecha-hoy').textContent = fechaFormat;

        // Validar periodo de paro (23 Dic 2026 - 1 Ene 2027)
        const inicioParo = new Date('2026-12-23T00:00:00');
        const finParo = new Date('2027-01-01T23:59:59');

        if (hoy >= inicioParo && hoy <= finParo) {
            document.getElementById('patron-hoy').textContent = "PARO DE PLANTA (Sin Operaciones)";
            document.getElementById('patron-hoy').style.color = "#c00";
            return;
        }

        const patrones = ['Patrón A (Matutino)', 'Patrón B (Vespertino)', 'Patrón C (Nocturno)'];
        const diaDelAno = Math.floor((hoy - new Date(hoy.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const patronAsignado = patrones[diaDelAno % patrones.length];
        
        document.getElementById('patron-hoy').textContent = patronAsignado;
        document.getElementById('patron-hoy').style.color = "#333";
    }

    // Inicializar el calendario al cargar la página
    obtenerPatronDeHoy();

</script>
</body>
</html>
